name: ticket-watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; actual start can lag a few minutes
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to commit state/state.json

concurrency:
  group: ticket-watcher      # never run two at once (state file safety)
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BMS_URL: ${{ vars.BMS_URL }}
          DISTRICT_URL: ${{ vars.DISTRICT_URL }}
          # 0 = one check per run. Set repo variable RUN_SECONDS=240 to poll every ~35s
          # inside each run (near-continuous, but uses far more Actions minutes).
          HEARTBEAT_MINUTES: ${{ vars.HEARTBEAT_MINUTES || '10' }}  # status message interval; 0 = off
          RUN_SECONDS: ${{ vars.RUN_SECONDS || '0' }}
        run: python watcher.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "ticket-watcher[bot]"
          git config user.email "ticket-watcher@users.noreply.github.com"
          git add state/state.json || true
          git diff --cached --quiet && exit 0
          git commit -m "state: update [skip ci]"
          git pull --rebase -q || true
          git push
